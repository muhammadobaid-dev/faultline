<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — ObaidGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo" aria-hidden="true">O</div>
            <div>
                <h1>ObaidGPT</h1>
                <p>Your personal AI assistant</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>Create an account</h2>
            <p>Sign up to start chatting with ObaidGPT.</p>
        </div>

        <p id="register-error" class="error-message login-error"></p>

        <form id="register-form" class="login-form">
            <div class="login-field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Choose a username"
                    required
                    autofocus
                    autocomplete="username"
                >
            </div>

            <div class="login-field">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="login-field">
                <label for="confirm-password">Confirm Password</label>
                <input
                    id="confirm-password"
                    name="confirm_password"
                    type="password"
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="login-button">
                Create Account
            </button>
        </form>

        <p class="login-switch">
            Already have an account?
            <a href="{{ url_for('home') }}">Log in</a>
        </p>
    </div>

    <p class="page-credit">
        Developed by <strong>MUHAMMAD OBAID</strong>
    </p>

    <script>
        window.BACKEND_URL = {{ backend_url | tojson }};
    </script>
    <script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
